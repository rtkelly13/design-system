name: Install Playwright Browsers
description: >-
  Installs the Chromium build the lockfile pins, bounding each attempt so a
  stalled download cannot run away with the job.

# Why this is not a one-line `run:` in each workflow.
#
# On 19 Aug this step took `main` red. `playwright install --with-deps` reaches
# out twice — apt for the system libraries, then Playwright's CDN for the
# browser — and on that run one of them hung. Nothing bounded it, so the step
# sat there for the full six-hour job limit before GitHub killed the run, which
# it then reported as `cancelled` rather than `failed`. Both `main` workflows
# died that way on the same commit; re-running CI by hand on the identical SHA
# passed in two minutes, browsers installed in 36 seconds.
#
# So the failure was transient, but the *cost* of it was not:
#   - six hours of runner time per hung job,
#   - a red `main` that reads as "cancelled", giving no hint anything hung,
#   - and no recovery short of a human noticing and re-running.
#
# Hence a bounded attempt plus one retry. A stall now costs minutes and clears
# itself, and if it genuinely cannot install, the step fails with a message
# saying so.
#
# The download half is also cached, which is the same story from the other end:
# of the 25 seconds this step cost when healthy, 13 were spent fetching ~300MB
# across three archives that never change until the lockfile does. Fewer network
# round trips is also one less chance to hang.
#
# Only that half is cacheable. `--with-deps` installs system libraries via apt,
# outside the cached directory, so a cache hit still has to run `install-deps` —
# deliberately, rather than assuming the runner image carries them. A missing
# shared library surfaces as a browser that will not launch, which is a red
# required check to save ten seconds.

inputs:
  browser:
    description: Playwright browser to install.
    required: false
    default: chromium
  attempt-timeout:
    description: >-
      Per-attempt wall clock. A healthy install takes well under a minute; this
      is set to bound a hang, not to accommodate a slow one.
    required: false
    default: 8m
  attempts:
    description: Number of attempts before failing the step.
    required: false
    default: '2'

runs:
  using: composite
  steps:
    # Keyed on `pnpm-lock.yaml`, which is correct rather than convenient: the
    # browser revision is pinned by the Playwright version in the lockfile (see
    # the determinism contract in `docs/visual-regression.md`), so a lockfile
    # change is exactly when a cached browser stops being the right one.
    - name: Restore browsers
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ inputs.browser }}-${{ hashFiles('pnpm-lock.yaml') }}

    # `pnpm exec`, not `npx`: npx silently falls back to fetching the latest
    # published CLI when the local bin is missing, and a Playwright other than
    # the lockfile's installs a different Chromium build. Under
    # `maxDiffPixels: 0` that does not fail loudly, it moves every baseline.
    - name: Install browsers
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
        ATTEMPT_TIMEOUT: ${{ inputs.attempt-timeout }}
        ATTEMPTS: ${{ inputs.attempts }}
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: |
        set -uo pipefail

        # One retry loop either way. A cache hit still needs the apt half, and
        # that reaches the network too — it is no less able to hang than the
        # download was, so it gets the same ceiling and the same second chance.
        if [ "${CACHE_HIT}" = "true" ]; then
          set -- install-deps "${BROWSER}"
        else
          set -- install --with-deps "${BROWSER}"
        fi
        echo "Running: playwright $*"

        for attempt in $(seq 1 "${ATTEMPTS}"); do
          # Status captured off the command itself. Reading `$?` after an
          # `if ...; fi` reads the *compound's* status, which is 0 when the
          # condition was false and no branch ran — every failure would have
          # looked like a success.
          status=0
          timeout "${ATTEMPT_TIMEOUT}" pnpm exec playwright "$@" || status=$?
          if [ "${status}" -eq 0 ]; then
            exit 0
          fi
          if [ "${status}" -eq 124 ]; then
            echo "::warning::Attempt ${attempt}/${ATTEMPTS} stalled and was killed after ${ATTEMPT_TIMEOUT}."
          else
            echo "::warning::Attempt ${attempt}/${ATTEMPTS} failed with exit ${status}."
          fi
          if [ "${attempt}" -lt "${ATTEMPTS}" ]; then
            sleep 15
          fi
        done
        echo "::error::playwright $* failed ${ATTEMPTS} times."
        exit 1

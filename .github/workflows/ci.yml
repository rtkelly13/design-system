name: CI & Visual Regression Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Build, Typecheck, Storybook & Visual Regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # theme.css is generated from src/theme/levels.ts. This fails if the
      # committed CSS no longer matches the source, which is the only thing
      # keeping the TS and CSS halves of the ladder in step.
      - name: Theme Token Drift
        run: pnpm tokens:check

      # Every text-on-surface and border-on-surface pair, on every level.
      - name: Contrast Gate
        run: pnpm check:contrast

      # Ratchet: fails if the count of colour-instead-of-role call sites rises.
      - name: Token Hygiene
        run: pnpm check:tokens

      # Ratchet: fails if styling moves back into a stylesheet.
      - name: CSS Surface
        run: pnpm check:css

      - name: Type Check
        run: pnpm typecheck

      - name: Build Package
        run: pnpm build

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Visual Regression Tests
        run: pnpm test:visual

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Generated Snapshots Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-snapshots
          path: tests/__snapshots__/
          retention-days: 7

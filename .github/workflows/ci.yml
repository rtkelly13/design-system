name: CI & Visual Regression Checks

on:
  push:
    branches:
      - main
  # Deliberately unfiltered. `branches: [main]` here filters on the PR's *base*,
  # so a pull request into anything else got no CI at all — not a failure, not a
  # pending check, nothing. A stacked PR showed only the Vercel comment check and
  # read as "nothing to run", which is the worst way for a gate to be absent.
  #
  # A pull request is a request to merge, and it should be gated wherever it is
  # aimed. The push trigger keeps its filter because that one is the post-merge
  # signal for the default branch specifically.
  pull_request:
  # Manual re-run, for the one case the two triggers above cannot cover: the
  # snapshot workflow commits baselines with `GITHUB_TOKEN`, and GitHub does not
  # start workflow runs from those pushes. The PR then holds its previous visual
  # result with no way to refresh it short of an empty commit. See AGENTS.md
  # rule 8. Dispatch requires this file on the default branch, so it helps the
  # next branch rather than the one that adds it.
  workflow_dispatch:

# Supersede an in-flight run when the branch moves on: a result for a commit
# nobody is looking at any more is holding a runner the next push needs.
# `storybook-walkthrough.yml` already did this and `ci.yml` did not.
#
# Keyed on the event as well as the ref so a `workflow_dispatch` — rule 8's
# manual re-run, the only way to refresh a bot-pushed baseline — is in its own
# group. It therefore neither cancels the push run nor gets cancelled by one,
# and `cancel-in-progress` is false for it, because a re-run someone asked for
# by hand should never be thrown away.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Three jobs in parallel, then one that reports their verdict.
#
# This was a single job of nineteen serial steps. Nothing in it needed to be
# serial: the gates read the tree, the visual suite needs only a built
# Storybook, and no step consumed a previous step's output except
# `check:visual-coverage`, which reads `storybook-static/index.json`. The cost
# was structural rather than a slow step — every gate added since has been
# appended to the same chain, so the wall clock only ever grew, and the fastest
# and most frequently-failing check in the repo (`lint`) reported after the
# browser install and the screenshot suite had also run.
#
# Split, the critical path is the visual job alone and the gates report in about
# half a minute. The two new gates in flight (`check:api`, `check:licenses`)
# land in `unit` beside `build`, where there is roughly twenty seconds of
# headroom before that job becomes the critical path again.
#
# Every job carries a `timeout-minutes` per AGENTS.md rule 9. Only `visual`
# installs a browser, so only its ceiling has to clear that step's retry budget;
# the other three are sized to their own work, which is the point of splitting
# them — a hung gate no longer waits out a browser-shaped timeout.
# Job names are lowercase, snake_case, and at most two words, drawn from the
# shared lexicon in `shared-utilities`' governance map (`ci`, `build`, `test`,
# `lint`, `visual`, `publish`, ...). The comment on `verify` below says why:
# a name that describes the work has to change when the work changes.
# `repo-governance check-names` warns on names that drift from this.
jobs:
  gates:
    name: lint
    runs-on: ubuntu-latest
    # ~30s of Node scripts and one eslint pass, no network past `pnpm install`.
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # theme.css is generated from src/theme/levels.ts. This fails if the
      # committed CSS no longer matches the source, which is the only thing
      # keeping the TS and CSS halves of the ladder in step.
      #
      # It reads the tree as committed, so it must not share a job with
      # `pnpm build` — which regenerates theme.css as its first act. Being in a
      # separate job now makes that structural rather than a matter of step
      # ordering.
      - name: Theme Token Drift
        run: pnpm tokens:check

      # Every text-on-surface and border-on-surface pair, on every level.
      - name: Contrast Gate
        run: pnpm check:contrast

      # Ratchet: fails if the count of colour-instead-of-role call sites rises.
      - name: Lint — colour literals and unknown classnames
        run: pnpm lint

      # Ratchet: fails if styling moves back into a stylesheet.
      - name: CSS Surface
        run: pnpm check:css

      # Self-hosted fonts ship as @font-face rules nothing is obliged to
      # reference. This fails if a --ds-font-* stack cannot name a family the
      # installed @fontsource packages declare — the failure mode that otherwise
      # surfaces only as "nearly every visual baseline moved".
      - name: Font Reachability
        run: pnpm check:fonts

      # knip finds unused/unlisted packages; check-deps.mjs requires each one to
      # have a stated reason, sit in the matching section, and — for CSS — be
      # reachable through the exports map.
      - name: Dependencies
        run: pnpm check:deps

  unit:
    name: test
    runs-on: ubuntu-latest
    # ~35s: tsc, the Vitest suite, and a tsup build.
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Type Check
        run: pnpm typecheck

      # Stays before `Build Package`, and the order is load-bearing rather than
      # incidental: `src/package-shape.test.ts` asserts on what `files` declares
      # while `dist/` does not yet exist. Running it after a build would change
      # what it is testing.
      - name: Unit Tests
        run: pnpm test

      - name: Build Package
        run: pnpm build

  visual:
    name: visual
    runs-on: ubuntu-latest
    # The only job here that installs a browser, so the only one that has to
    # clear `install-playwright`'s retry budget: two 8-minute attempts plus
    # ~1.5 minutes of everything else is 18. Sized above that for the same
    # reason ci.yml's single job was — a job cap firing mid-retry reports
    # `cancelled` and names no step, which is the failure rule 9 exists for.
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # No `pnpm build` first: Storybook compiles from `src/`, not from `dist/`,
      # so this job does not depend on the package build and can run beside it.
      - name: Build Storybook
        run: pnpm build-storybook

      # Reads storybook-static/index.json, so it has to follow the build. Fails
      # if a story lands without being asserted or explicitly excluded.
      - name: Visual Coverage
        run: pnpm check:visual-coverage

      - name: Install Playwright Browsers
        uses: ./.github/actions/install-playwright

      - name: Run Visual Regression Tests
        run: pnpm test:visual

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Generated Snapshots Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-snapshots
          path: tests/__snapshots__/
          retention-days: 7

  # One check that stands or falls with all three jobs above.
  #
  # `ci` is the string branch protection matches on, and it is deliberately
  # content-free. The previous name listed what CI did — "Build, Typecheck,
  # Storybook & Visual Regression" — with a comment here saying not to rename
  # it. That did not survive contact: splitting the single job into three added
  # "Unit Tests" to the middle of the name, and the required check in
  # `shared-utilities`' governance map went on naming a job that no longer
  # reported. Every PR then failed `repo-governance verify-pr-checks` on a
  # missing check while all seven checks were green.
  #
  # A name that describes the work has to change when the work changes, so it
  # cannot also be a stable contract. This one names nothing, so jobs above can
  # be split, renamed or added to without touching repository settings or the
  # governance map again.
  verify:
    name: ci
    runs-on: ubuntu-latest
    needs: [gates, unit, visual]
    # `always()`, so this reports a verdict when a job fails rather than being
    # skipped — a skipped required check is indistinguishable from one still
    # running, and blocks the PR either way.
    if: always()
    # Reads three strings and exits. A ceiling anyway, per rule 9: "every job",
    # including the ones that obviously cannot hang.
    timeout-minutes: 5

    steps:
      - name: Report the verdict of every job
        env:
          GATES: ${{ needs.gates.result }}
          UNIT: ${{ needs.unit.result }}
          VISUAL: ${{ needs.visual.result }}
        run: |
          set -uo pipefail
          failed=0
          for job in GATES UNIT VISUAL; do
            result="${!job}"
            if [ "${result}" = "success" ]; then
              echo "✅ ${job}: ${result}"
            else
              echo "::error::${job} did not succeed (${result})"
              failed=1
            fi
          done
          exit "${failed}"

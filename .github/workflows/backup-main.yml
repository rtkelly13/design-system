name: Backup main branch

# Periodically mirrors main to main-backup as a recovery point. main-backup is
# force-pushed over on every run, so it always reflects main as of the last
# schedule tick — restore with: git push origin main-backup:main (via a PR or
# temporarily lifted ruleset, since main is protected).

on:
  schedule:
    - cron: "17 2 * * *" # daily, 02:17 UTC (off the whole-hour rush)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup-main
  cancel-in-progress: false

jobs:
  backup:
    name: Force-push main to main-backup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (full history)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Force-push to main-backup
        run: git push --force origin main:refs/heads/main-backup

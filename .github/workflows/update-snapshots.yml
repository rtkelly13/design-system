name: Update Visual Regression Snapshots

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for updating visual snapshots'
        required: true
        default: 'Update component baseline snapshots'

jobs:
  update-snapshots:
    name: Update Snapshots on Linux
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook Static
        run: pnpm build-storybook

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Visual Snapshots
        run: pnpm test:visual:update

      - name: Commit Baseline Snapshots
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(visual): update Playwright baseline visual snapshots"
          file_pattern: "tests/__snapshots__/**"

      - name: Upload Snapshot Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: playwright-snapshots
          path: tests/__snapshots__/
          retention-days: 7

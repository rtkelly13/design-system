name: Update Visual Regression Snapshots

# Regenerates the Playwright visual baselines on Linux and commits them back to
# the branch this run was dispatched on.
#
# Usually reached by commenting `/update-snapshots` on a PR
# (`update-snapshots-command.yml`), which is the point: a change that
# legitimately alters rendering can be re-baselined from inside the PR rather
# than only after merging. Direct dispatch still works for baselining `main`.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for updating visual snapshots'
        required: true
        default: 'Update component baseline snapshots'
      pr-number:
        description: 'PR to report results back to (set by /update-snapshots)'
        required: false
        default: ''
      mode:
        description: >-
          Which baselines to write. "missing" (the default) only creates ones
          that do not exist, so a run that adds a story cannot silently
          re-record an existing baseline that has drifted — which is how a
          regression gets baked in. Choose "changed" or "all" deliberately, when
          a change is *meant* to alter rendering.
        required: false
        default: 'missing'
        type: choice
        options:
          - missing
          - changed
          - all

jobs:
  update-snapshots:
    name: Update Snapshots on Linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # The SHA every baseline below is generated against. Compared to the
      # branch tip again before committing, because a run that regenerates
      # against one tree and commits onto another produces a baseline that
      # matches neither.
      - name: Record the commit under test
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook Static
        run: pnpm build-storybook

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # `missing` mode writes the baseline and then reports that test as failed —
      # deliberately, via a Playwright soft error, so that creating a baseline is
      # never silent. A non-zero exit is therefore the *expected* outcome of
      # bootstrapping a story, not an error, and failing the job on it is why
      # `/update-snapshots` could never actually create one: every step below,
      # including the commit, was skipped. The baselines were written on the
      # runner and thrown away with it.
      #
      # Tolerated, not ignored. The verify step re-runs the suite with no update
      # flag, so a baseline that does not reproduce — a story that renders
      # non-deterministically, or Storybook's error overlay caught by
      # `story-ready.ts` — fails there and nothing is committed. That step is the
      # gate; this one only produces candidates.
      - name: Generate Visual Snapshots
        continue-on-error: true
        env:
          MODE: ${{ inputs.mode }}
        run: npx playwright test tests/visual.spec.ts --update-snapshots="${MODE:-missing}"

      - name: Summarise what changed
        id: changes
        run: |
          set -euo pipefail
          added=$(git ls-files --others --exclude-standard tests/__snapshots__ | wc -l)
          modified=$(git diff --name-only tests/__snapshots__ | wc -l)
          {
            echo "added=${added}"
            echo "modified=${modified}"
            echo 'files<<SNAPSHOT_EOF'
            git ls-files --others --exclude-standard tests/__snapshots__ | sed 's/^/A  /'
            git diff --name-only tests/__snapshots__ | sed 's/^/M  /'
            echo 'SNAPSHOT_EOF'
          } >> "$GITHUB_OUTPUT"

      # Proves the regenerated baselines are self-consistent before they are
      # committed. Worth the extra minute: the branch's own visual check will
      # NOT re-run off the commit below, because GitHub does not start workflow
      # runs from GITHUB_TOKEN pushes. Without this the only signal a reviewer
      # gets is "some files changed".
      - name: Verify suite passes against the new baselines
        run: pnpm test:visual

      # Commit straight back to the branch this run was dispatched on — the
      # repo blocks Actions from creating pull requests, so the previous
      # peter-evans/create-pull-request approach can never work here.
      #
      # The push is checked against the tip rather than forced onto it. A run
      # takes about three minutes, and pushing during that window used to lose
      # the whole thing: the baselines regenerated correctly, the verify step
      # passed, the commit was made, and `git push` was rejected as non-fast-
      # forward — after which the failure comment blamed a story that would not
      # render. The baselines existed and were thrown away with the runner.
      #
      # Rebasing the snapshot commit onto the new tip would make the push
      # succeed and is the wrong fix: these images were rendered from
      # ${{ steps.base.outputs.sha }} and verified against it, so re-applying
      # them over someone else's later commit commits a baseline nothing has
      # checked. Failing here loses three minutes; that would bake in an
      # unverified expectation, which is the exact failure `maxDiffPixels: 0`
      # exists to prevent.
      - name: Commit & push snapshots
        id: commit
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain tests/__snapshots__)" ]; then
            echo "Snapshots already match — nothing to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          tip=$(git rev-parse FETCH_HEAD)
          if [ "${tip}" != "${BASE_SHA}" ]; then
            {
              echo "committed=false"
              echo "raced=true"
              echo "moved_to=${tip}"
            } >> "$GITHUB_OUTPUT"
            echo "::error::${GITHUB_REF_NAME} moved from ${BASE_SHA} to ${tip} while this run was generating baselines. Nothing committed — re-run /update-snapshots on the new tip."
            exit 1
          fi

          git add tests/__snapshots__
          git commit -m "chore(visual): update Playwright baseline visual snapshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Report success on the PR
        if: success() && inputs.pr-number != ''
        uses: actions/github-script@v7
        env:
          COMMITTED: ${{ steps.commit.outputs.committed }}
          ADDED: ${{ steps.changes.outputs.added }}
          MODIFIED: ${{ steps.changes.outputs.modified }}
          FILES: ${{ steps.changes.outputs.files }}
          PR_NUMBER: ${{ inputs.pr-number }}
          MODE: ${{ inputs.mode }}
        with:
          script: |
            const { COMMITTED, ADDED, MODIFIED, FILES, PR_NUMBER } = process.env;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = COMMITTED === 'true'
              ? [
                  '### 📸 Baselines updated',
                  '',
                  `Mode: \`${process.env.MODE}\`.`,
                  '',
                  `**${ADDED}** added, **${MODIFIED}** modified. The suite was re-run against`,
                  'the new baselines and passed, so they are self-consistent.',
                  '',
                  '<details><summary>Changed snapshots</summary>',
                  '',
                  '```',
                  (FILES || '').trim() || '(none)',
                  '```',
                  '',
                  '</details>',
                  '',
                  '> [!IMPORTANT]',
                  '> Review the images in the commit before merging — a regenerated',
                  '> baseline records whatever rendered, including a regression.',
                  '',
                  "This PR's visual check still shows its previous result: GitHub does not",
                  'start workflow runs from `GITHUB_TOKEN` pushes. Re-run it, or push any',
                  'commit, to see it go green.',
                  '',
                  `[Run log](${runUrl})`,
                ].join('\n')
              : [
                  '### 📸 Baselines already current',
                  '',
                  'Nothing to commit — the existing baselines already match what this',
                  'branch renders.',
                  '',
                  `[Run log](${runUrl})`,
                ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(PR_NUMBER),
              body,
            });

      - name: Report failure on the PR
        if: failure() && inputs.pr-number != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
          RACED: ${{ steps.commit.outputs.raced }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          MOVED_TO: ${{ steps.commit.outputs.moved_to }}
        with:
          script: |
            const { RACED, BASE_SHA, MOVED_TO } = process.env;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const short = (sha) => (sha || '').slice(0, 7);

            // Named causes only. This comment used to assert a story had failed
            // to render whatever had actually gone wrong, which sent the reader
            // looking for a bug that was not there.
            const body = RACED === 'true'
              ? [
                  '### ❌ Snapshot update raced a push',
                  '',
                  `This run generated its baselines against \`${short(BASE_SHA)}\`, but the`,
                  `branch is now at \`${short(MOVED_TO)}\`. They were **not** committed:`,
                  'they were rendered from, and verified against, a tree that is no longer',
                  'the tip, so committing them would record an expectation nothing has',
                  'checked.',
                  '',
                  'Nothing is wrong with the branch — re-run `/update-snapshots` and let it',
                  'finish before pushing again. It takes about three minutes.',
                  '',
                  `[Run log](${runUrl})`,
                ].join('\n')
              : [
                  '### ❌ Snapshot update failed',
                  '',
                  'No baselines were committed. The run log says which step failed; the',
                  'two that usually do are:',
                  '',
                  '- **Verify** — the regenerated baselines did not reproduce on a second',
                  '  run, so a story renders non-deterministically.',
                  "- **Generate** — a story failed to render and `tests/story-ready.ts`",
                  "  caught it, rather than screenshotting Storybook's error overlay.",
                  '',
                  `[Run log](${runUrl})`,
                ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body,
            });

      - name: Upload Snapshot Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-snapshots
          path: tests/__snapshots__/
          retention-days: 7

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-snapshot-update
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

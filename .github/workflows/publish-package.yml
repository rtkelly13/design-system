name: Publish Design System to GitHub Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@rtkelly13'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Build
        run: pnpm build

      - name: Publish Package to GitHub Packages
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@rtkelly13/design-system@${VERSION}" version --registry=https://npm.pkg.github.com > /dev/null 2>&1; then
            echo "Version ${VERSION} is already published to GitHub Packages. Skipping publish step."
          else
            echo "Publishing version ${VERSION} to GitHub Packages..."
            pnpm publish --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

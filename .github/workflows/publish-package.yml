name: Publish Design System to npm

# Publishes via npm Trusted Publishing (OIDC) — no NPM_TOKEN secret. npm
# trusts this exact workflow file (configured on the package's npmjs.com
# settings page), and npm >= 11.5 exchanges the Actions OIDC token for a
# publish credential and attaches provenance automatically.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing + provenance

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5; Node 22 bundles an older npm.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Build
        run: pnpm build

      - name: Publish Package to npm
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@rtkelly13/design-system@${VERSION}" version > /dev/null 2>&1; then
            echo "Version ${VERSION} is already published to npm. Skipping publish step."
          else
            echo "Publishing version ${VERSION} to npm..."
            npm publish
          fi

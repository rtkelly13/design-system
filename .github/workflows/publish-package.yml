name: Publish Packages to npm

# Publishes via npm Trusted Publishing (OIDC) — no NPM_TOKEN secret. npm
# trusts this exact workflow file (configured on the package's npmjs.com
# settings page), and npm >= 11.5 exchanges the Actions OIDC token for a
# publish credential and attaches provenance automatically.
#
# Two modes:
#   - Stable: push to main / v* tag (or a plain workflow_dispatch) publishes
#     each package's version under the `latest` dist-tag, skipping any that
#     already exist.
#
# Two packages, published in dependency order: @rtkelly13/design-system then
# @rtkelly13/design-system-report, which declares the first as a peer. Neither uses the
# `workspace:` protocol in package.json, deliberately — `npm publish` does not
# rewrite it, and rewriting is `pnpm publish`'s job, which is not the path
# trusted publishing goes through here. pnpm still links the local copy, because
# the workspace version satisfies the declared range.
#   - Dev: workflow_dispatch with dev=true (usually via the `/publish-dev` PR
#     comment — see publish-dev-command.yml) publishes
#     `<version>-dev.<pr>.<short-sha>` under the `dev` dist-tag so consumers
#     can trial a branch: `pnpm add @rtkelly13/design-system@dev`.
#     Trusted publishing is scoped to this workflow FILE, not a branch, so
#     dispatching it on a PR branch still authenticates.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dev:
        description: 'Publish a dev prerelease (<version>-dev.<pr>.<sha>) under the `dev` dist-tag'
        type: boolean
        default: false
      pr-number:
        description: 'PR number to embed in the dev version (used by /publish-dev)'
        type: string
        default: ''

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing + provenance

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5; Node 22 bundles an older npm.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Set dev prerelease version
        if: inputs.dev == true
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          PR_SEGMENT="${{ inputs.pr-number }}"
          for dir in packages/design-system packages/design-system-report; do
            BASE_VERSION=$(node -p "require('./${dir}/package.json').version.split('-')[0]")
            DEV_VERSION="${BASE_VERSION}-dev.${PR_SEGMENT:-0}.${SHORT_SHA}"
            (cd "${dir}" && npm version "${DEV_VERSION}" --no-git-tag-version)
            echo "Publishing ${dir} as ${DEV_VERSION}"
          done

      - name: Run Build
        run: pnpm build

      # Order matters: ds-report declares design-system as a peer, so publishing
      # it first would advertise a version that does not exist yet.
      - name: Publish Packages to npm
        shell: bash
        run: |
          TAG="${{ inputs.dev == true && 'dev' || 'latest' }}"
          for dir in packages/design-system packages/design-system-report; do
            NAME=$(node -p "require('./${dir}/package.json').name")
            VERSION=$(node -p "require('./${dir}/package.json').version")
            if npm view "${NAME}@${VERSION}" version > /dev/null 2>&1; then
              echo "${NAME}@${VERSION} is already published. Skipping."
            else
              echo "Publishing ${NAME}@${VERSION} (dist-tag: ${TAG})..."
              (cd "${dir}" && npm publish --tag "${TAG}")
            fi
          done

      - name: Job summary
        shell: bash
        run: |
          for dir in packages/design-system packages/design-system-report; do
            NAME=$(node -p "require('./${dir}/package.json').name")
            VERSION=$(node -p "require('./${dir}/package.json').version")
            echo "Published (or found existing) **${NAME}@${VERSION}**" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "pnpm add ${NAME}@${VERSION}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

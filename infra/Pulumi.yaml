name: design-system-infra
runtime:
  name: nodejs
  options:
    packagemanager: pnpm
description: >-
  Vercel hosting for the design-system Storybook: the project that builds the
  static Storybook, the production domain (design-system.ryankelly.dev), and a
  branch domain (preview.design-system.ryankelly.dev) pinned to the `preview`
  branch. Optionally the companion project that builds the blog's Storybook,
  which this one composes into its sidebar.
